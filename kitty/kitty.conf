# ----------------------------
# Kitty - clean dark red theme
# ----------------------------

font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        12.5

disable_ligatures never
confirm_os_window_close 0
enable_audio_bell no
visual_bell_duration 0
window_padding_width 12
cursor_shape beam
cursor_blink_interval 0.6
shell_integration enabled

# Tab looks
tab_bar_edge bottom
tab_bar_style powerline
tab_powerline_style slanted
active_tab_font_style bold
inactive_tab_font_style normal

# Transparency
background_opacity 0.906

# Dark red color palette
background              #0d0809
foreground              #e6d7d9
selection_background    #4a1f26
selection_foreground    #f5e9eb
url_color               #c95a6a

cursor                  #d16a78
cursor_text_color       #0d0809

active_border_color     #6b1f2b
inactive_border_color   #241517
bell_border_color       #8a2d3c

active_tab_background   #6b1f2b
active_tab_foreground   #f7eef0
inactive_tab_background #161012
inactive_tab_foreground #9a8589

# Normal
color0  #151012
color1  #7a2835
color2  #8f4a56
color3  #a05a52
color4  #6c3f46
color5  #8f3d4d
color6  #7f5a60
color7  #d8c7ca

# Bright
color8  #4a2b30
color9  #b13a4d
color10 #b56773
color11 #c47a6b
color12 #8b5961
color13 #b25c6d
color14 #a07b82
color15 #f2e8ea
